# ingest 设备识别规则
#
# 这是 ingest 首次运行时自动写出的出厂默认配置。可以随意修改、增删
# 设备条目。每次运行时 ingest 都会重新读取本文件——不需要重启什么。
#
# 字段说明：
#   id            必填，设备唯一标识，CLI 用 --device <id> 强指定
#   name          人类可读名称；默认模板里 {device_name} 即此值
#                 （空格会被自动替换为下划线，避免目录名带空格）
#   manufacturer  可选，厂商名，仅用于 `ingest devices list` 展示
#   detect:       三档置信度的识别规则，命中任意一档即视为匹配
#     volume_labels  卷标包含任一字符串（不区分大小写）→ 0.90
#     directories    给出的目录全部存在 → 0.80
#     file_patterns  根目录或下两层 glob 命中 → 0.70
#
# 多个设备同时匹配时取最高置信度。
version: "1"

devices:
  - id: zve10m2
    name: "SONY ZVE10M2"
    manufacturer: "SONY"
    detect:
      volume_labels: ["SONY"]
      # 卡上的实际结构（截屏验证）：
      #   DCIM/100MSDCF/        图片：DSC*.JPG / DSC*.ARW
      #   PRIVATE/M4ROOT/CLIP/  视频主码流：C*.MP4
      #   PRIVATE/M4ROOT/SUB/   视频代理流（缩略低码率版本）
      #   PRIVATE/M4ROOT/THMBNL/  缩略图
      #   PRIVATE/SONY/         相机内固件 / LUT，不是文件指纹的核心
      # 用 PRIVATE/M4ROOT + DCIM/100MSDCF 双指纹避免对杂牌 U 盘误判
      # （仅有 DCIM 的卡很常见，不是 ZVE10M2 的强证据）。
      directories: ["PRIVATE/M4ROOT", "DCIM/100MSDCF"]
      file_patterns: ["C*.MP4", "DSC*.ARW", "DSC*.JPG"]


  - id: canon-r7
    name: "Canon EOS R7"
    manufacturer: "Canon"
    detect:
      volume_labels: ["EOS_DIGITAL", "CANON"]
      # R7 卡结构（实测）：
      #   DCIM/100EOSR7/  图片：*.CR3（JPG 同名前缀）
      #   MISC/           佳能通用目录，单独不能作指纹
      # 以机型目录 DCIM/100EOSR7 作强指纹。
      directories: ["DCIM/100EOSR7"]
      file_patterns: ["*.CR3", "*.JPG"]

  - id: pocket3
    name: "DJI Pocket3"
    manufacturer: "DJI"
    detect:
      volume_labels: ["DJI"]
      # 卡上的实际结构（截屏验证）：
      #   DCIM/DJI_001/         视频 / 照片 / 音频；序号会滚动到 DJI_002 等
      #   MISC/IDX/             索引文件
      #   MISC/THM/DJI_001/     缩略图
      # DJI_NNN 序号会变，不放进 directories 里；用 MISC/THM + MISC/IDX
      # 作 DJI 专属指纹——别的相机一般没有顶层 MISC 目录。
      directories: ["MISC/THM", "MISC/IDX"]
      # file_patterns 走 root + 1 + 2 层 glob，DCIM/DJI_001/DJI_0001.MP4 能命中
      file_patterns: ["DJI_*.MP4", "DJI_*.JPG", "DJI_*.WAV"]
