# ingest 全局设置
#
# 这是 ingest 首次运行时自动写出的出厂默认配置。可以随意修改、增删字段。
# 设备识别规则放在另一个文件 devices.yaml；本文件只装"工具行为"层面的设置。
#
# 字段说明：
#   gap_days  自动分段时允许的日期间隔（天）。两个相邻文件的拍摄日期相差
#             ≤ gap_days 视为同一事件；> gap_days 起新段。默认 1：只有
#             当天 + 第二天的素材会被合在一个事件里，中间空一天就分开。

version: "1"
gap_days: 1

#   staging_dir  两段式拷卡的中转目录（给 Hook 做 rate 用）。
#                为空 = 单段直拷到目标；有值 = watch 先落这里，Hook 后再转拷。
#                例 Windows: "D:\\ingest-staging"
#   cleanup_staging  转拷成功后是否删除 staging 里的批次目录。默认 true。
#   hooks.after_batch  每段拷贝成功后跑的命令（按顺序），支持变量：
#                {target} 本段目标目录，{device} 设备 id，{device_name} 设备名。
#                命令失败只记录进 manifest，不推翻导入结果。
#                例: - "hilight rate --root \"{target}\" --no-dry-run"

staging_dir: ""
cleanup_staging: true
hooks:
  after_batch: []
